name: Auto Translate PR Docs (TESTING)

on:
  pull_request:
    branches:
      # ──────────【測試替代欄位 1】──────────
      # 測試時：設定為你的模擬 main 分支（例如 translate-main）
      # 上線前修改：改回 - main
      - translate-main
    types: [opened, synchronize]
    # 【稽核修正】新增 paths filter：只有 .md 內容變更才觸發整套流程，
    # 避免改圖片、改 workflow 本身等無關變更也跑一次翻譯 job。
    paths:
      - "docs/**/*.md"

# 【稽核修正】同一 PR 連續 push 會產生多個 run，彼此可能競爭寫入同一個
# bot/test-translate-* 分支；用 concurrency 讓同一分支只保留最新一次執行。
concurrency:
  group: auto-translate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # 【稽核修正】把「分支命名慣例」檢查獨立成一個 job，改用正規表達式驗證
  # <工程師代稱>/yyyy-mm-dd 的格式，取代原本寫死 startsWith(head_ref, 'Ann/')
  # 只認得單一人名的判斷方式，讓其他文件工程師的分支也能被正確觸發。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: 檢查分支是否符合 <engineer>/yyyy-mm-dd 命名慣例
        id: check
        run: |
          HEAD_REF="${{ github.head_ref }}"
          if [[ "$HEAD_REF" =~ ^[A-Za-z0-9_-]+/[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::分支名稱「$HEAD_REF」不符合 <engineer>/yyyy-mm-dd 慣例，略過自動翻譯。"
          fi

  translate:
    needs: guard
    if: needs.guard.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    # 【稽核修正】避免 API 卡住時無限占用 runner。
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # 【稽核提示，未變更】目前用的是長期有效的 Service Account JSON 金鑰。
          # 建議之後改用 Workload Identity Federation（OIDC）取代長期金鑰，
          # 但需要 GCP 管理者提供 workload identity pool / provider 資源名稱，
          # 此次修正沒有這些資訊，故先保留原設定，待資訊補齊後再切換。
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Dependencies
        run: |
          # 【稽核修正】腳本改用 regex 保護標記法處理 markdown 語法，
          # 不再需要 beautifulsoup4 / markdown，移除以縮短安裝與攻擊面。
          pip install google-cloud-translate

      - name: Detect PR Changes and Translate
        env:
          # ──────────【測試替代欄位 2】──────────
          # 測試時：指定比對的基準為遠端的 translate-main 分支
          # 上線前修改：改回 ${{ github.base_ref }}（讓它自動抓取正式 PR 的目標分支）
          BASE_BRANCH: "translate-main"
          # 【稽核修正】補上腳本實際需要的翻譯參數；GCP_PROJECT_ID 需另外
          # 於 repo/organization secrets 設定，這裡無法代填實際專案編號。
          TARGET_LANGUAGE: "en"
          SOURCE_LANGUAGE: "zh-TW"
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: "global"
        run: |
          python .github/scripts/google_translate_changes.py

      - name: Create Pull Request for Translation Review
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: 🤖 [TEST] 自動精準翻譯更新段落"
          branch: "bot/test-translate-${{ github.head_ref }}"

          # ──────────【測試替代欄位 3】──────────
          # 測試時：加上 [TEST] 標籤，方便你在 GitHub 上辨識
          # 上線前修改：拿掉 [TEST] 字樣，恢復正式標題
          title: "[TEST] 翻譯確認：${{ github.event.pull_request.title }}"
          body: |
            ## 這是自動翻譯【測試】通知
            目前正在測試 `translate-main` 的局部段落翻譯流程。

            > 【稽核提示】此 PR 的 base 是原始的 `${{ github.head_ref }}`分支，
            > 而不是直接對 main／translate-main 開 PR——設計上是希望翻譯結果
            > 先併回文件工程師的分支，再隨原 PR 一起上線；若這不是預期行為，
            > 請與需求方確認後調整此處的 `base` 設定。
            >
            > 合併本 PR 回原分支時，建議在合併訊息中加上 `[skip ci]`，
            > 避免又重新觸發一次本翻譯 workflow。
          base: ${{ github.head_ref }}
