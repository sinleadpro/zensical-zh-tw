clickable_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.blocks.caption]

[project.markdown_extensions.zensical.extensions.preview]
[[project.markdown_extensions.zensical.extensions.preview.configurations]]
#sources.include = ["**/*.md"]
#sources.exclude = []
#targets.include = ["ec/*", "pos/**"]
#targets.exclude = []
targets.include = [
    "resources/references/*"
]

[project.plugins.autorefs]
# Optional: Set how link titles are generated
# options: "auto" (default), "true", "false", or "external"
link_titles = "auto"

# Optional: Prevent stripping of HTML tags from titles
#strip_title_tags = false

[project.markdown_extensions.zensical.extensions.glightbox]
auto_caption = true

[project.markdown_extensions.zensical.extensions.macros]
module_name = "main"
modules = []
